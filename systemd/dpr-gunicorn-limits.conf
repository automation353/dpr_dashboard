# Drop-in: /etc/systemd/system/dpr-gunicorn.service.d/limits.conf
# Keeps the DPR dashboard from ever taking over the shared 2-core / 8 GB server.
# Normal use is ~150 MB and a few % CPU; these are ceilings, not targets.
[Service]
# Throttle (reclaim) above MemoryHigh, hard stop (restart) at MemoryMax.
MemoryHigh=600M
MemoryMax=800M
# At most one of the two cores.
CPUQuota=100%
# If the server ever runs out of memory, kill DPR before jcpl / jolly voucher.
OOMScoreAdjust=500
