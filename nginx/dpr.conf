# DPR Dashboard: https://dpr.jcplportal.tech -> gunicorn on 127.0.0.1:8020.
# Completely separate from the jcpl portal's server blocks.
#
# Install as /etc/nginx/sites-enabled/zz-dpr. The "zz-" prefix matters: nginx
# uses the FIRST server block on a port as the default for unknown hosts, and
# jcpl's 443 block has no `default_server`. Loading after jcpl keeps jcpl the
# default, so https://<ip>/ and other hostnames are unchanged.
#
# Certificate: obtained with certbot's webroot mode (it does NOT edit any nginx
# file):  certbot certonly --webroot -w /var/www/dpr-acme -d dpr.jcplportal.tech
# Renewal runs from certbot's timer and reloads nginx via its deploy hook.

server {
    listen 80;
    listen [::]:80;
    server_name dpr.jcplportal.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dpr-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dpr.jcplportal.tech;

    ssl_certificate     /etc/letsencrypt/live/dpr.jcplportal.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dpr.jcplportal.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Excel downloads: stream straight through instead of spooling to disk.
    location = /api/export/download {
        proxy_pass         http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 600s;
    }
}
