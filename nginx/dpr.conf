# DPR Dashboard — standalone, served at dpr.jcplportal.tech → gunicorn on
# 127.0.0.1:8020. Completely separate from the jcpl portal server block.
# `certbot --nginx -d dpr.jcplportal.tech` will add the 443 server + HTTP→HTTPS
# redirect once DNS for dpr.jcplportal.tech points at this host.
server {
    listen 80;
    listen [::]:80;
    server_name dpr.jcplportal.tech;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
